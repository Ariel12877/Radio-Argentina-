<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Radio AR" />
  <meta name="description" content="Radios de Argentina en vivo. Interfaz simple tipo cassette de auto. Sin publicidad." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <title>Radio Argentina · Cassette</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Cabecera tipo radio de auto -->
    <header class="radio-header">
      <div class="brand">RADIO AR</div>
      <div class="status" id="status">LISTO</div>
    </header>

    <!-- Display principal -->
    <section class="display">
      <div class="freq" id="freq">—</div>
      <div class="station-name" id="stationName">Seleccioná una emisora</div>
      <div class="now-playing" id="nowPlaying"></div>
      <div class="vu-meter">
        <div class="vu-bar" id="vu"></div>
      </div>
    </section>

    <!-- Controles principales -->
    <section class="controls">
      <button class="btn-power" id="btnPower" title="Encender / Apagar" aria-label="Power">
        <span class="power-icon">⏻</span>
      </button>
      <button class="btn-play" id="btnPlay" title="Play / Pause" aria-label="Play">
        <span id="playIcon">▶</span>
      </button>
      <div class="volume-wrap">
        <label for="volume">VOL</label>
        <input type="range" id="volume" min="0" max="100" value="80" />
      </div>
    </section>

    <!-- Botonera de emisoras (estilo preset de radio de auto) -->
    <section class="presets">
      <div class="presets-label">EMISORAS</div>
      <div class="preset-grid" id="presetGrid">
        <!-- se llenan por JS -->
      </div>
    </section>

    <!-- Pie -->
    <footer class="footer">
      <p>Sin publicidad · Solo streams públicos</p>
      <button class="install-btn" id="installBtn" hidden>Instalar app</button>
    </footer>
  </div>

  <audio id="player" preload="none" crossorigin="anonymous"></audio>
  <script src="app.js"></script>
</body>
</html>
